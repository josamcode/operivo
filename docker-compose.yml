# Local PostgreSQL for Opervio (isolated from any other local databases).
services:
  db:
    image: postgres:18-alpine
    container_name: opervio-mvp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opervio
      POSTGRES_PASSWORD: opervio
      POSTGRES_DB: opervio
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - opervio-mvp-pg:/var/lib/postgresql
volumes:
  opervio-mvp-pg:
